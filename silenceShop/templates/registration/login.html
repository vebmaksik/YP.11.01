{% extends 'base.html' %}
{% block title %}Авторизация — Черная Тишина{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">АВТОРИЗАЦИЯ ФИКСЕРА</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions" style="justify-content: center; flex-direction: column; gap: 15px;">
            <button type="submit" class="btn" style="width: 100%;">Войти в систему</button>
            <p style="text-align: center; font-size: 13px; margin: 0;">
                Нет учетной записи? <a href="{% url 'signup' %}" style="color: #cda869; text-decoration: none;">Зарегистрироваться</a>
            </p>
        </div>
    </form>
</div>
{% endblock %}
